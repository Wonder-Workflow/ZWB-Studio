[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[dev]
  command = "npm run dev"
  targetPort = 43177
  port = 8888

[[redirects]]
  from = "/api/auth"
  to = "/.netlify/functions/auth"
  status = 200

[[redirects]]
  from = "/api/overrides"
  to = "/.netlify/functions/overrides"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
